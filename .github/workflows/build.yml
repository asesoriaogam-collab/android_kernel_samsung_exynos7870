name: Build NetHunter Kernel J701M

on:
  push:
    branches: [ "nethunter-j7neo" ]
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32z1-dev liblz4-tool libncurses5-dev libssl-dev libxml2-utils lzop python-is-python3 python2-minimal rsync squashfs-tools xsltproc zip zlib1g-dev

      - name: 2. Checkout del codigo
        uses: actions/checkout@v4

      - name: 3. Descargar Toolchain GCC 4.9 ARM64
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git ${GITHUB_WORKSPACE}/gcc64

      - name: 4. Integrar Drivers TP-Link y Resolver Simbolo cfg80211_connect_bss
        run: |
          # 1. Fix para yylloc en scripts/dtc
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.l || true
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.lex.c_shipped || true

          # 2. Configurar defconfig para compilar los Realtek externos como modulos (.ko)
          sed -i 's/CONFIG_R8188EU=y/# CONFIG_R8188EU is not set/g' arch/arm64/configs/exynos7870-j7velte_defconfig || true
          sed -i 's/CONFIG_RTL8188EU=y/CONFIG_RTL8188EU=m/g' arch/arm64/configs/exynos7870-j7velte_defconfig || true
          sed -i 's/CONFIG_88XXAU=y/CONFIG_88XXAU=m/g' arch/arm64/configs/exynos7870-j7velte_defconfig || true
          echo "CONFIG_WIRELESS_EXT=y" >> arch/arm64/configs/exynos7870-j7velte_defconfig
          echo "CONFIG_WEXT_PRIV=y" >> arch/arm64/configs/exynos7870-j7velte_defconfig
          sed -i '/r8188eu/d' drivers/staging/Makefile || true
          sed -i '/r8188eu/d' drivers/staging/Kconfig || true

          # 3. Clonar RTL8188EUS (TL-WN722N v2/v3) y RTL8812AU (Archer T2U)
          git clone --depth=1 -b v5.3.9 https://github.com/aircrack-ng/rtl8188eus.git drivers/net/wireless/rtl8188eus
          git clone --depth=1 -b v5.6.4.2 https://github.com/aircrack-ng/rtl8812au.git drivers/net/wireless/rtl8812au

          # 4. Reemplazar directamente cfg80211_connect_bss por un wrapper inline a cfg80211_connect_result en ambos drivers
          for drv in rtl8188eus rtl8812au; do
            sed -i 's/CONFIG_PLATFORM_I386_PC = y/CONFIG_PLATFORM_I386_PC = n/g' drivers/net/wireless/$drv/Makefile
            sed -i 's/CONFIG_RTW_ANDROID = .*/CONFIG_RTW_ANDROID = 0/g' drivers/net/wireless/$drv/Makefile
            sed -i '1i EXTRA_CFLAGS += -DCONFIG_LITTLE_ENDIAN -DCONFIG_IOCTL_CFG80211 -DRTW_USE_CFG80211_STA_EVENT -DIEEE80211_BSS_TYPE_ANY=0 -DIEEE80211_PRIVACY_ANY=0 -DNL80211_TIMEOUT_UNSPECIFIED=0 -Wno-error -Wno-incompatible-pointer-types' drivers/net/wireless/$drv/Makefile

            # Ajustar rtw_cfg80211_disconnected a 5 argumentos (firma de 3.18)
            sed -i 's/cfg80211_disconnected(wdev_to_ndev(wdev), reason, ie, ie_len, locally_generated, gfp)/cfg80211_disconnected(wdev_to_ndev(wdev), reason, ie, ie_len, gfp)/g' drivers/net/wireless/$drv/os_dep/linux/ioctl_cfg80211.h || true
            sed -i 's/cfg80211_disconnected(wdev_to_ndev(wdev), reason, ie, ie_len, ie_len, gfp)/cfg80211_disconnected(wdev_to_ndev(wdev), reason, ie, ie_len, gfp)/g' drivers/net/wireless/$drv/os_dep/linux/ioctl_cfg80211.h || true

            # Ajustar cfg80211_vendor_event_alloc a 4 argumentos en rtw_cfgvendor.c (firma de 3.18)
            sed -i 's/cfg80211_vendor_event_alloc(wiphy, NULL, len, event_id, gfp)/cfg80211_vendor_event_alloc(wiphy, len, event_id, gfp)/g' drivers/net/wireless/$drv/os_dep/linux/rtw_cfgvendor.c || true
            sed -i 's/cfg80211_vendor_event_alloc(wiphy, wdev, len, event_id, gfp)/cfg80211_vendor_event_alloc(wiphy, len, event_id, gfp)/g' drivers/net/wireless/$drv/os_dep/linux/rtw_cfgvendor.c || true

            # Redefinir cfg80211_connect_bss como macro hacia cfg80211_connect_result para eliminar el error de MODPOST
            sed -i '1i #define cfg80211_connect_bss(dev, bssid, bss, req_ie, req_ie_len, resp_ie, resp_ie_len, status, gfp, ...) cfg80211_connect_result(dev, bssid, req_ie, req_ie_len, resp_ie, resp_ie_len, status, gfp)' drivers/net/wireless/$drv/os_dep/linux/ioctl_cfg80211.c
          done

          echo 'obj-$(CONFIG_RTL8188EU) += rtl8188eus/' >> drivers/net/wireless/Makefile
          sed -i '$i source "drivers/net/wireless/rtl8188eus/Kconfig"' drivers/net/wireless/Kconfig
          echo 'obj-$(CONFIG_88XXAU) += rtl8812au/' >> drivers/net/wireless/Makefile
          sed -i '$i source "drivers/net/wireless/rtl8812au/Kconfig"' drivers/net/wireless/Kconfig

      - name: 5. Compilar Kernel y Modulos Wi-Fi
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="${GITHUB_WORKSPACE}/gcc64/bin:$PATH"
          export CROSS_COMPILE=aarch64-linux-android-
          export ANDROID_MAJOR_VERSION=q
          make HOSTCFLAGS="-fcommon" exynos7870-j7velte_defconfig
          make HOSTCFLAGS="-fcommon" -j$(nproc --all)
          make HOSTCFLAGS="-fcommon" modules -j$(nproc --all)

      - name: 6. Empaquetar con AnyKernel3 (Kernel + Modulos .ko)
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cp arch/arm64/boot/Image AnyKernel3/
          mkdir -p AnyKernel3/modules/system/lib/modules
          find drivers/net/wireless/ -name "*.ko" -exec cp -v {} AnyKernel3/modules/system/lib/modules/ \;

          cat << 'AK3' > AnyKernel3/anykernel.sh
          properties() { '
          kernel.string=NetHunter-J7Neo-LOS17.1-TPLink
          do.devicecheck=1
          do.modules=1
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=j7velte
          device.name2=j7veltedx
          device.name3=SM-J701M
          device.name4=SM-J701F
          device.name5=j7nxtlte
          '; }
          block=/dev/block/platform/13540000.dwmmc0/by-name/BOOT;
          is_slot_device=0;
          ramdisk_compression=auto;
          . tools/ak3-core.sh;
          dump_boot;
          write_boot;
          AK3
          cd AnyKernel3
          rm -rf .git README.md
          zip -r9 ../NetHunter-J701M-LOS17.1-TPLink.zip *

      - name: 7. Subir ZIP Flasheable
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-J701M-LOS17.1-TPLink
          path: NetHunter-J701M-LOS17.1-TPLink.zip
